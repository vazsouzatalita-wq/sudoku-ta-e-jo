
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku 100% Funcional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Sudoku</h1>
    
    <div class="difficulty-selector">
      <button onclick="generateNewGame('easy')">Fácil</button>
      <button onclick="generateNewGame('medium')">Médio</button>
      <button onclick="generateNewGame('hard')">Difícil</button>
    </div>

    <!-- Tabuleiro -->
    <div id="sudoku-board" class="board"></div>

    <!-- Teclado de cliques -->
    <div class="number-pad">
      <button onclick="pressNumber(1)">1</button>
      <button onclick="pressNumber(2)">2</button>
      <button onclick="pressNumber(3)">3</button>
      <button onclick="pressNumber(4)">4</button>
      <button onclick="pressNumber(5)">5</button>
      <button onclick="pressNumber(6)">6</button>
      <button onclick="pressNumber(7)">7</button>
      <button onclick="pressNumber(8)">8</button>
      <button onclick="pressNumber(9)">9</button>
      <button onclick="pressNumber('')" class="clear-btn">Apagar</button>
    </div>

    <div class="game-controls">
      <button id="check-btn" onclick="checkVictory()">Verificar Jogo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
